version: '3.8'

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - ./database/mysql:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    profiles:
      - postgresql

  registro-ms:
    build:
      context: .
      dockerfile: docker/Dockerfile.registro-ms
    ports:
      - "5001:8080"
    environment:
      Database__Provider: MySql
      Database__ConnectionString: "Server=mysql;Port=3306;Database=registro_db;User=root;Password=root;CharSet=utf8mb4;"
    depends_on:
      - mysql

  api-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    ports:
      - "5000:8080"
    environment:
      ReverseProxy__Clusters__registro-ms-cluster__Destinations__d1__Address: "http://registro-ms:8080/"
    depends_on:
      - registro-ms
